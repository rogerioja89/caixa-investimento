# =============================================
# Banco principal: SQLite (arquivo investimentos.db na raiz do projeto)
# =============================================
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:investimentos.db
quarkus.datasource.username=
quarkus.datasource.password=

# "update": Hibernate cria as tabelas se não existirem e atualiza a estrutura se necessário.
# Não apaga os dados ao reiniciar. O DataSeeder cuida do seed inicial.
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true

# Serializa LocalDateTime como texto ISO 8601 (ex: 2026-05-04T14:00:00)
# em vez de um array de números [2026,5,4,14,0,0]
quarkus.jackson.write-dates-as-timestamps=false

# =============================================
# Banco de testes: H2 em memória
# O prefixo %test. sobrescreve as configs acima durante os testes.
# "drop-and-create": recria tudo do zero a cada execução de testes.
# O DataSeeder também roda no teste e insere os produtos automaticamente.
# =============================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:investimentos;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.log.sql=true